<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santiago Quest - Tablero TDAH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .glow-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .custom-checkbox input:checked + div {
            background-color: #10b981;
            border-color: #10b981;
        }
        .custom-checkbox input:checked + div i {
            display: block;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 p-4">
        <div class="glow-card max-w-sm w-full p-6 rounded-2xl text-center space-y-6 border border-indigo-500/30">
            <div class="w-20 h-20 bg-indigo-600/20 text-indigo-400 rounded-full flex items-center justify-center mx-auto text-3xl shadow-lg border border-indigo-500/40">
                <i class="fa-solid fa-gamepad"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-white tracking-wide">Santiago Quest</h1>
                <p class="text-xs text-slate-400 mt-1">Ingresa tu PIN de acceso para continuar</p>
            </div>
            
            <div class="space-y-4">
                <input type="password" id="pin-input" maxlength="4" placeholder="••••" class="w-full text-center text-2xl tracking-[0.5em] bg-slate-900 border border-slate-700 rounded-xl py-3 text-white focus:outline-none focus:border-indigo-500 transition">
                <button onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl shadow-lg transition active:scale-95">
                    Entrar al Tablero <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </div>
            
            <div class="pt-2 border-t border-slate-800 text-xs text-slate-500 space-y-1">
                <p>🔑 Santiago: <span class="text-indigo-400 font-mono">1234</span></p>
                <p>🔒 Admin / Padres: <span class="text-emerald-400 font-mono">9999</span></p>
            </div>
            <p id="login-error" class="text-red-400 text-xs hidden">PIN Incorrecto. Intenta de nuevo.</p>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="app-content" class="hidden">
        <!-- HEADER -->
        <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-3">
            <div class="max-w-md mx-auto flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md">
                        <i class="fa-solid fa-user-astronaut"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-sm leading-tight text-white">Hola, Santiago</h2>
                        <span id="role-badge" class="text-[10px] bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded-full font-medium">Modo Jugador</span>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <div class="bg-amber-500/10 border border-amber-500/30 text-amber-400 px-3 py-1 rounded-xl text-xs font-bold flex items-center space-x-1">
                        <i class="fa-solid fa-star text-amber-400"></i>
                        <span id="points-display">0</span> pts
                    </div>
                    <button onclick="logout()" class="text-slate-400 hover:text-white p-2">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- NAVEGACIÓN PRINCIPAL -->
        <nav class="max-w-md mx-auto px-4 mt-4">
            <div class="grid grid-cols-3 gap-2 bg-slate-900/60 p-1 rounded-xl border border-slate-800 text-xs">
                <button onclick="switchTab('tasks')" id="tab-tasks" class="py-2 rounded-lg font-medium text-center bg-indigo-600 text-white transition">
                    <i class="fa-solid fa-list-check mb-1 block text-sm"></i> Rutina
                </button>
                <button onclick="switchTab('piggy')" id="tab-piggy" class="py-2 rounded-lg font-medium text-center text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-piggy-bank mb-1 block text-sm"></i> Ahorro
                </button>
                <button onclick="switchTab('rewards')" id="tab-rewards" class="py-2 rounded-lg font-medium text-center text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-gift mb-1 block text-sm"></i> Premios
                </button>
                <button onclick="switchTab('admin')" id="tab-admin" class="hidden col-span-3 py-2 rounded-lg font-medium text-center bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 transition mt-1">
                    <i class="fa-solid fa-chart-line mr-1"></i> 📊 Histórico y Métricas (Padres)
                </button>
            </div>
        </nav>

        <!-- SECCIONES -->
        <main class="max-w-md mx-auto px-4 mt-4 space-y-4">

            <!-- SECCIÓN 1: RUTINAS / TAREAS -->
            <div id="section-tasks" class="space-y-4">
                <div class="glow-card p-4 rounded-2xl flex items-center justify-between border-l-4 border-indigo-500">
                    <div>
                        <p class="text-xs text-slate-400">Progreso del Día</p>
                        <h3 id="progress-text" class="text-lg font-bold text-white">0 de 5 tareas</h3>
                    </div>
                    <div class="w-12 h-12 rounded-full border-4 border-indigo-500/30 flex items-center justify-center font-bold text-xs text-indigo-400" id="progress-circle">
                        0%
                    </div>
                </div>

                <div class="space-y-3" id="tasks-container">
                    <!-- Tareas generadas dinámicamente -->
                </div>
            </div>

            <!-- SECCIÓN 2: AHOR
